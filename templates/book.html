<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} | {{ book_title }}</title>
    <link rel="stylesheet" href="../../assets/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Merriweather:wght@300;400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="reader-layout">
        <aside class="sidebar">
            <a href="../../index.html" class="back-link">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Library
            </a>
            <div class="toc">
                {% for page in toc %}
                <a href="{{ page.filename }}"
                    class="toc-item {% if page.filename == current_filename %}active{% endif %}">
                    {{ page.title }}
                </a>
                {% endfor %}
            </div>
        </aside>

        <main class="content-area">
            <div class="paper">
                <div class="page-content">
                    {{ content | safe }}
                </div>

                <div class="nav-controls">
                    {% if prev_page %}
                    <a href="{{ prev_page }}" class="nav-btn">← Previous</a>
                    {% else %}
                    <span class="nav-btn disabled">← Previous</span>
                    {% endif %}

                    {% if next_page %}
                    <a href="{{ next_page }}" class="nav-btn">Next →</a>
                    {% else %}
                    <span class="nav-btn disabled">Next →</span>
                    {% endif %}
                </div>
            </div>
        </main>
    </div>
    <script src="../../assets/script.js"></script>
</body>

</html>
